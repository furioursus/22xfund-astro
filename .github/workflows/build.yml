name: Build

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # astro 7 requires >= 22.12.0
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `astro check && astro build`, so this gates on
      # type errors as well as a successful build.
      - name: Build
        run: npm run build
